title: Suspicious AI SDK or Agent Framework Execution
id: 5e61d2ac-e842-4f67-9a7f-59f68194bcf4
status: experimental
description: Detects command-line references to common AI SDKs, local model clients, or agent frameworks executed by interpreters in a potentially suspicious context.
author: Yuval Sinay
date: 2026-07-30
references:
  - https://github.com/yuval14/Cybersecurity-Detection-Rules/tree/main/AI-Enabled-Threat-Detection-Framework
logsource:
  category: process_creation
  product: windows
detection:
  selection_interpreter:
    Image|endswith:
      - '\python.exe'
      - '\python3.exe'
      - '\py.exe'
      - '\node.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_ai_terms:
    CommandLine|contains:
      - 'openai'
      - 'anthropic'
      - 'langchain'
      - 'langgraph'
      - 'autogen'
      - 'crewai'
      - 'ollama'
      - 'llama-index'
      - 'llama_index'
      - 'transformers'
      - 'litellm'
      - 'mcp'
  filter_known_paths:
    CommandLine|contains:
      - '\Program Files\'
      - '\ProgramData\approved-ai\'
      - '\Users\Public\approved-ai\'
  condition: all of selection_* and not filter_known_paths
falsepositives:
  - Approved AI development, data-science, automation, or security engineering activity.
  - Administrative scripts that inventory AI packages or services.
level: medium
tags:
  - attack.execution
  - attack.t1059
  - attack.resource-development
  - detection.ai-enabled-threat
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - CurrentDirectory
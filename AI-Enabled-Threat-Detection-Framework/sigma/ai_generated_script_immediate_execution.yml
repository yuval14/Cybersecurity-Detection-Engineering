title: Script Created in Temporary Directory and Immediately Executed
id: 9f1650a7-ad78-4a2e-a426-2657f3221282
status: experimental
description: Detects interpreters executing scripts from temporary or public writable locations with names suggestive of generated output. Use temporal file-creation correlation where supported to improve fidelity.
author: Yuval Sinay
date: 2026-07-30
references:
  - https://github.com/yuval14/Cybersecurity-Detection-Rules/tree/main/AI-Enabled-Threat-Detection-Framework
logsource:
  category: process_creation
  product: windows
detection:
  selection_interpreter:
    Image|endswith:
      - '\python.exe'
      - '\python3.exe'
      - '\py.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\node.exe'
  selection_writable_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
  selection_generated_name:
    CommandLine|contains:
      - 'generated_'
      - 'payload_'
      - 'output_'
      - 'response_'
      - 'agent_task_'
      - 'tool_result_'
      - 'next_action_'
      - 'exploit_' 
  filter_approved:
    CommandLine|contains:
      - '\approved-ai\'
      - '\security-validation\'
      - '\software-deployment\'
  condition: all of selection_* and not filter_approved
falsepositives:
  - Software installers, automated testing, deployment tools, and approved security validation.
  - Legitimate AI-assisted development using temporary build or execution directories.
level: medium
tags:
  - attack.execution
  - attack.t1059
  - attack.t1204
  - detection.ai-enabled-threat
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - CurrentDirectory
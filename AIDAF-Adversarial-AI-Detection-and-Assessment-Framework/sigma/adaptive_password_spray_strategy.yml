title: Adaptive Password Spray Strategy Variation
id: 4b64afdf-b888-4ca5-99ca-3e9a3d1b9102
status: experimental
description: Detects repeated failed authentication attempts from the same source with changing usernames, timing, or client characteristics. Correlate in the SIEM to identify adaptive strategy changes potentially supported by AI.
author: Yuval Sinay
date: 2026-07-30
logsource:
  category: authentication
  definition: Requires source IP, target user, result, client identifier, and timestamp.
detection:
  selection:
    outcome: failure
  condition: selection
falsepositives:
  - Misconfigured applications
  - Shared proxies
  - Authorized password audits
level: medium
tags:

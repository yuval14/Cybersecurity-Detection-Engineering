title: New or Low-Reputation Domain Sends Credential-Like Data to Backend as a Service
id: ad1e03ea-588e-49d5-8c1f-dd09a3981a89
status: experimental
description: Correlates a new or low-reputation source domain, brand-impersonating credential form activity, and browser communication with Supabase, Firebase, or a similar Backend-as-a-Service project. Derived from AI-assisted phishing application patterns including COINBAIT.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use
  - ../case-studies/COINBAIT.md
author: Yuval Sinay
date: 2026-08-05
tags:
  - aidaf.external
  - aidaf.case.coinbait
  - attack.credential-access
  - attack.exfiltration
correlation:
  type: temporal
  rules:
    - new_or_low_reputation_brand_impersonating_domain
    - credential_or_token_form_submission
    - browser_connection_to_unapproved_baas_project
  group-by:
    - User
    - SourceIP
    - BrowserSession
  timespan: 30m
level: high
falsepositives:
  - New legitimate startups
  - Internal prototypes and testing
  - Approved low-code applications
  - Newly deployed SaaS services
notes:
  - Do not block Backend-as-a-Service providers globally.
  - Enrich with domain age, brand mismatch, referrer, certificate, project identifier, submitted data type, and affected user population.
  - Preserve HTML, JavaScript, form fields, network requests, project identifiers, and lure infrastructure.
  - Reset submitted credentials and revoke active sessions when compromise is plausible.
title: Credential-Like Submission to Backend-as-a-Service from an Untrusted Site
id: 89f223ac-8d50-4160-964c-b18d2b455fba
status: experimental
description: Detects web requests containing credential-like parameters to Supabase, Firebase, or similar Backend-as-a-Service endpoints. Intended for enrichment with source-domain age, reputation, brand mismatch, and approved-project inventories.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use
  - https://attack.mitre.org/techniques/T1056/003/
author: Yuval Sinay
date: 2026-08-05
tags:
  - attack.credential-access
  - attack.t1056.003
  - attack.exfiltration
  - aidaf.external
  - aidaf.case.coinbait
logsource:
  category: proxy
detection:
  selection_baas:
    url|contains:
      - '.supabase.co/'
      - 'firebaseio.com/'
      - 'firebasedatabase.app/'
      - 'identitytoolkit.googleapis.com/'
  selection_credential_fields:
    request_body|contains:
      - 'password='
      - 'passwd='
      - 'username='
      - 'email='
      - 'otp='
      - 'token='
      - 'seed_phrase='
      - 'private_key='
  condition: selection_baas and selection_credential_fields
falsepositives:
  - Approved applications using Supabase, Firebase, or comparable services
  - Legitimate authentication and registration workflows
  - Internal prototypes and development environments
level: high
notes:
  - Enrich with the referring domain, domain age, application owner, BaaS project identifier, user population, and DLP classification.
  - Do not block entire BaaS platforms based on this rule alone.
  - Field names vary by proxy schema and require local mapping.
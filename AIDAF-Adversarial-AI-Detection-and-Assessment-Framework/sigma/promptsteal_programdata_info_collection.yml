title: PROMPTSTEAL System and Document Collection to ProgramData Info Directory
id: 91dc6242-c8d4-44a9-8911-131cb94c2604
status: experimental
description: Detects command shells collecting system, domain, process, service, network, Office, PDF, or text data into C:\ProgramData\info, as observed in PROMPTSTEAL operations.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
  - https://attack.mitre.org/techniques/T1005/
  - https://attack.mitre.org/techniques/T1082/
author: Yuval Sinay
date: 2026-07-30
tags:
  - attack.collection
  - attack.t1005
  - attack.discovery
  - attack.t1082
  - aidaf.internal
  - aidaf.case.promptsteal
logsource:
  category: process_creation
  product: windows
detection:
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_path:
    CommandLine|contains:
      - 'C:\ProgramData\info'
      - 'C:\Programdata\info'
  selection_collection:
    CommandLine|contains:
      - 'systeminfo'
      - 'tasklist'
      - 'sc query'
      - 'ipconfig'
      - 'netstat'
      - 'nltest'
      - 'Get-ComputerInfo'
      - 'Get-ChildItem'
      - 'Documents'
      - 'Downloads'
      - 'Desktop'
      - '*.doc'
      - '*.pdf'
      - '*.txt'
  condition: selection_shell and selection_path and selection_collection
falsepositives:
  - Authorized inventory or incident-response scripts using this exact staging directory
level: high
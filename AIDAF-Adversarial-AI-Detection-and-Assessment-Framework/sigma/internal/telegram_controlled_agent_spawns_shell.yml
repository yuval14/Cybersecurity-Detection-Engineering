title: Telegram-Controlled Agent Spawns Shell or Offensive Tool
id: 0ea1f6f3-24ac-4ba1-9f4d-41b1ec44383e
status: experimental
description: Detects an agent, bot or Python process with Telegram-related command-line context spawning a shell, scanner or network utility.
references:
  - https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/
author: Yuval Sinay
date: 2026-07-30
tags:
  - attack.command-and-control
  - attack.t1102
  - attack.execution
logsource:
  category: process_creation
  product: linux
detection:
  parent:
    ParentCommandLine|contains:
      - 'telegram'
      - 'bot_token'
      - 'TELEGRAM_BOT_TOKEN'
      - 'hermes'
  child:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/curl'
      - '/wget'
      - '/nuclei'
      - '/nmap'
      - '/python'
      - '/python3'
  condition: parent and child
falsepositives:
  - Authorized chatops automation
  - Security orchestration platforms
level: high
title: AI CLI Secret Search Followed by GitHub Repository Exfiltration
id: 25153ca9-0d59-4f95-af40-141cb94c2605
status: experimental
description: Detects locally installed AI CLI or agent tooling used to search for secrets followed by Git commands that create or push to a GitHub repository, reflecting QUIETVAULT tradecraft.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1567/001/
author: Yuval Sinay
date: 2026-07-30
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1567.001
  - aidaf.internal
  - aidaf.case.quietvault
logsource:
  category: process_creation
  product: windows
detection:
  selection_ai_context:
    ParentImage|endswith:
      - '\claude.exe'
      - '\codex.exe'
      - '\aider.exe'
      - '\python.exe'
      - '\node.exe'
    ParentCommandLine|contains:
      - 'secret'
      - 'token'
      - 'credential'
      - 'github'
      - 'npm'
      - 'agent'
  selection_git:
    Image|endswith:
      - '\git.exe'
      - '\gh.exe'
    CommandLine|contains:
      - 'repo create'
      - 'git push'
      - 'github.com'
  condition: selection_ai_context and selection_git
falsepositives:
  - Authorized secret-scanning and remediation workflows
  - Developers using AI tools to prepare legitimate repositories
level: critical
notes:
  - Correlate with access to .npmrc, GitHub credentials, environment files, browser token stores, or source-control tokens.
  - Increase confidence when the destination repository is newly created and publicly accessible.
title: AI Agent Invalid Credential Retry and Adaptation Loop
id: d8a6d573-98d6-4a6f-8a4e-4fb56d45c105
status: experimental
description: Detects repeated use of invalid or nonexistent credentials followed by rapid changes in target, protocol, or account from a common agent or process context. Inspired by provider reporting of agentic cyber operations producing hallucinated credentials and adapting after failures.
references:
  - https://www.anthropic.com/news/disrupting-AI-espionage
  - https://www.microsoft.com/en-us/security/blog/2026/03/06/ai-as-tradecraft-how-threat-actors-operationalize-ai/
author: Yuval Sinay
date: 2026-07-30
tags:
  - attack.credential-access
  - attack.t1110
  - attack.lateral-movement
  - aidaf.internal
  - aidaf.agentic
logsource:
  category: authentication
detection:
  failure:
    outcome:
      - failure
      - denied
      - invalid
    reason|contains:
      - 'unknown user'
      - 'invalid credential'
      - 'account does not exist'
      - 'bad password'
  agent_context:
    process.command_line|contains:
      - 'agent'
      - 'claude'
      - 'langchain'
      - 'autogen'
      - 'crewai'
      - 'mcp'
  condition: failure and agent_context
falsepositives:
  - Authorized red-team automation
  - Misconfigured identity synchronization
level: medium